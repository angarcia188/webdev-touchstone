<!DOCTYPE html>
<html lang="en">
<!--
Inquiry and pre order request form
Location information
Hours of operation
-->

<head>
    <meta charset="UTF-8">
    <title>North Star Bakery - Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <img src="images/bakery-logo_c.png" alt="North Star Bakery Logo" width="300" height="200">
        <nav aria-label="Primary">
            <ul>
                <li><a href="index.html">Homepage</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Information</h1>
        <h2>Inquiry and Pre-Order Request Form</h2>
        <form action="/preorder" method="post">
            <fieldset>
                <legend>Contact Information</legend>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
                <br>
                <label for="pickup-date">Pickup Date:</label>
                <input type="date" id="pickup-date" name="pickup-date" required>
                <br>
                <label for="request-type">Request Type:</label>
                <select id="request-type" name="request-type" required>
                    <option value="">Select an option</option>
                    <option value="pre-order">Pre-order</option>
                    <option value="general-question">General question</option>
                </select>
                <br>
                <label for="item-details">Item Details:</label>
                <textarea id="item-details" name="item-details" rows="4" required></textarea>
                <br>
                <label for="allergy-notes">Allergy Notes:</label>
                <textarea id="allergy-notes" name="allergy-notes" rows="3"
                    placeholder="List any allergies or dietary concerns, if applicable."></textarea>
                <br>
            </fieldset>
            <button type="submit">Submit</button>
        </form>
        <h2>Location Information</h2>
        <p>INSERT LOCATION INFORMATION CONTENT</p>
        <h2>Hours of Operation</h2>
        <p>INSERT HOURS OF OPERATION CONTENT</p>
    </main>

    <footer>
        <nav aria-label="Footer">
            <ul>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </footer>
</body>

</html>
